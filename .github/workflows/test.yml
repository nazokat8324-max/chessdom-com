# Har push va pull request'da avtomatik testlar (npm test). Natija GitHub → Actions bo'limida.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Brauzer testlari uchun runner'dagi Google Chrome.
      # Yiqilgan testlar va xato matni annotatsiya (::error::) bo'lib chiqadi — jurnalni yuklamasdan ham ko'rinadi.
      - name: npm test
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          if npm test 2>&1 | tee test.log; then exit 0; fi
          # Avval yiqilgan testlar nomi (CI da reporter TAP — "not ok N - nom"; terminalda "✖ nom"), keyin tafsilotlar.
          # GitHub bitta qadamda ko'pi bilan 10 ta annotatsiya ko'rsatadi — nomlar birinchi bo'lsin.
          { grep -E "^\s*not ok [0-9]+ - |^\s*✖ " test.log | grep -v "failing tests" | head -8
            grep -E "AssertionError|actual:|expected:|Error:" test.log | head -20; } | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
