<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1114">
  <title>ChessDom</title>
  <!-- Service worker internet yo'q paytda ko'rsatadi (sw.js) -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; color: #e8eef0;
      background: radial-gradient(circle at 30% 0%, rgba(1, 204, 213, 0.18), transparent 50%), #0b1114; text-align: center; }
    .card { max-width: 360px; }
    img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 16px 40px rgba(1, 204, 213, 0.25); }
    h1 { margin: 20px 0 8px; font-size: 22px; }
    p { margin: 0 0 22px; color: #93a4aa; line-height: 1.5; }
    button { padding: 12px 26px; border: none; border-radius: 14px; background: #01ccd5; color: #032326; font-size: 15px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/icons/icon-192.png" alt="">
    <h1 id="t">No internet connection</h1>
    <p id="p">ChessDom needs the internet. Check your connection and try again.</p>
    <button id="b" onclick="location.reload()">Try again</button>
  </div>
  <script>
    var T = {
      uz: ["Internet aloqasi yo'q", "ChessDom ishlashi uchun internet kerak. Aloqani tekshirib, qayta urinib ko'ring.", "Qayta urinish"],
      ru: ['Нет подключения к интернету', 'Для ChessDom нужен интернет. Проверьте подключение и попробуйте снова.', 'Повторить'],
      es: ['Sin conexión a internet', 'ChessDom necesita internet. Revisa tu conexión e inténtalo de nuevo.', 'Reintentar'],
      de: ['Keine Internetverbindung', 'ChessDom braucht Internet. Prüfe deine Verbindung und versuche es erneut.', 'Erneut versuchen'],
      fr: ['Pas de connexion internet', 'ChessDom a besoin d’internet. Vérifiez votre connexion et réessayez.', 'Réessayer']
    };
    var l = null; try { l = localStorage.getItem('justChessLang'); } catch (e) {}
    var t = T[l] || T[(navigator.language || '').slice(0, 2)];
    if (t) { document.getElementById('t').textContent = t[0]; document.getElementById('p').textContent = t[1]; document.getElementById('b').textContent = t[2]; }
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
