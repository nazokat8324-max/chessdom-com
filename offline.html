<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1114">
  <title>ChessCaravan</title>
  <!-- Service worker internet yo'q paytda ko'rsatadi (sw.js). Pastda internetsiz o'yinlar — offline-games.js; barcha fayllar sw.js PRECACHE da. -->
  <style>
    html { min-height: 100%; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px 40px; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; color: #e8eef0;
      background: radial-gradient(circle at 30% 0%, rgba(1, 204, 213, 0.18), transparent 50%), #0b1114; text-align: center; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font: inherit; touch-action: manipulation; }
    [hidden] { display: none !important; }
    .card { max-width: 360px; margin: 0 auto; }
    .card img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 16px 40px rgba(1, 204, 213, 0.25); }
    h1 { margin: 20px 0 8px; font-size: 22px; }
    .card p { margin: 0 0 22px; color: #93a4aa; line-height: 1.5; }
    .og-btn, #b { padding: 12px 22px; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px; background: #16242a; color: #e8eef0; font-size: 15px; font-weight: 700; cursor: pointer; }
    #b, .og-btn.primary { border-color: transparent; background: #01ccd5; color: #032326; font-weight: 800; }
    .og-btn:focus-visible, .og-card:focus-visible, .og-sq:focus-visible { outline: 2px solid #01ccd5; outline-offset: 2px; }
    .og-play { max-width: 720px; margin: 36px auto 0; }
    .og-play > h2 { margin: 0 0 14px; font-size: 16px; color: #93a4aa; font-weight: 600; }
    .og-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
    .og-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
      background: linear-gradient(160deg, rgba(1, 204, 213, 0.08), rgba(255, 255, 255, 0.02)); color: #e8eef0; text-align: left; cursor: pointer; }
    .og-card:hover { border-color: rgba(1, 204, 213, 0.6); }
    .og-card .ic { font-size: 28px; line-height: 1; margin-bottom: 4px; }
    .og-card b { font-size: 16px; }
    .og-card span { color: #93a4aa; font-size: 13px; line-height: 1.4; }
    .og-card small { margin-top: 4px; color: #01ccd5; font-weight: 700; font-size: 12px; min-height: 1em; }
    /* O'yin sahifasi */
    .og-stage { max-width: 560px; margin: 0 auto; }
    .og-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .og-head h2 { flex: 1; margin: 0; font-size: 18px; text-align: left; }
    .og-icon { width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.14); background: #16242a; color: #e8eef0; font-size: 18px; cursor: pointer; }
    .og-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; min-height: 0; }
    .og-stats > span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #16242a; font-size: 14px; }
    .og-stats small { color: #93a4aa; }
    .og-stats .og-coin { width: 18px; height: 18px; }
    .og-target { color: #f2c14e; font-size: 20px; letter-spacing: 1px; }
    .og-hearts { color: #e5484d; letter-spacing: 2px; }
    .og-hearts i { font-style: normal; color: #3a4a50; }
    .og-player { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin: 6px 0; border-radius: 12px; background: #16242a; font-weight: 700; }
    .og-player span { display: inline-flex; align-items: center; gap: 8px; }
    .og-player img { width: 24px; height: 24px; }
    .og-player b { font-variant-numeric: tabular-nums; font-size: 18px; padding: 2px 10px; border-radius: 8px; min-width: 64px; }
    .og-player.on b { background: #e8eef0; color: #0b1114; }
    .og-player.on.low b { background: #e5484d; color: #fff; }
    .og-board { display: grid; grid-template-columns: repeat(8, 1fr); width: min(100%, calc(100vh - 230px), 520px); min-width: 220px; aspect-ratio: 1; margin: 0 auto;
      border-radius: 10px; overflow: hidden; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .og-sq { position: relative; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 0; aspect-ratio: 1; cursor: pointer; }
    .og-sq.l { background: #e4e9e6; }
    .og-sq.d { background: #5f9395; }
    .og-sq img { width: 88%; height: 88%; position: relative; z-index: 2; pointer-events: none; }
    .og-sq .og-coin, .og-sq .og-dune { position: absolute; width: 70%; height: 70%; z-index: 1; }
    .og-sq .og-ghost { opacity: 0.35; position: absolute; }
    .og-rk, .og-fl { position: absolute; font-style: normal; font-size: 10px; font-weight: 700; opacity: 0.75; z-index: 3; pointer-events: none; }
    .og-rk { left: 3px; top: 2px; }
    .og-fl { right: 3px; bottom: 1px; }
    .og-sq.l .og-rk, .og-sq.l .og-fl { color: #5f9395; }
    .og-sq.d .og-rk, .og-sq.d .og-fl { color: #e4e9e6; }
    .og-sq.last { box-shadow: inset 0 0 0 100px rgba(242, 193, 78, 0.38); }
    .og-sq.sel { box-shadow: inset 0 0 0 100px rgba(1, 204, 213, 0.5); }
    .og-sq.chk { box-shadow: inset 0 0 0 100px rgba(229, 72, 77, 0.6); }
    .og-sq.hint::after { content: ''; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(11, 17, 20, 0.35); z-index: 3; }
    .og-sq.cap::after { content: ''; position: absolute; inset: 6%; border-radius: 50%; border: 4px solid rgba(11, 17, 20, 0.35); z-index: 3; }
    .og-sq.hint.best::after { background: #f2c14e; box-shadow: 0 0 0 3px rgba(242, 193, 78, 0.5); }
    .og-sq.ok { box-shadow: inset 0 0 0 100px rgba(48, 196, 120, 0.6); }
    .og-sq.bad { box-shadow: inset 0 0 0 100px rgba(229, 72, 77, 0.6); }
    .og-sq.visited { box-shadow: inset 0 0 0 100px rgba(1, 204, 213, 0.28); }
    .og-sq.rock { cursor: default; }
    .og-step { position: absolute; z-index: 2; color: #0b1114; font-size: clamp(10px, 2.6vw, 15px); }
    .og-msg { min-height: 1.4em; margin: 12px 0 0; color: #93a4aa; line-height: 1.45; }
    .og-msg.warn { color: #f2c14e; font-weight: 700; }
    .og-msg.done { color: #e8eef0; font-weight: 700; font-size: 17px; }
    .og-ctl { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
    .og-seg { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; border-radius: 14px; background: #16242a; width: 100%; }
    .og-seg button { flex: 1 1 auto; min-height: 36px; padding: 6px 10px; border: 0; border-radius: 10px; background: transparent; color: #93a4aa; font-weight: 700; cursor: pointer; }
    .og-seg button.on { background: #01ccd5; color: #032326; }
    .og-check { display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; color: #93a4aa; cursor: pointer; }
    .og-check input { width: 18px; height: 18px; accent-color: #01ccd5; }
    .og-tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
    .og-token { width: 46px; height: 46px; padding: 4px; border: 2px solid transparent; border-radius: 12px; background: #e4e9e6; cursor: pointer; }
    .og-token.on { border-color: #01ccd5; box-shadow: 0 0 0 3px rgba(1, 204, 213, 0.4); }
    .og-token img { width: 100%; height: 100%; }
    .og-overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.6); }
    .og-promo { position: relative; padding: 20px 18px 16px; border-radius: 18px; background: #16242a; max-width: 100%; }
    .og-promo p { margin: 0 0 12px; font-weight: 700; }
    .og-promo div { display: flex; gap: 8px; }
    .og-promo div button { width: 64px; height: 64px; border: 0; border-radius: 12px; background: #e4e9e6; cursor: pointer; }
    .og-promo div img { width: 100%; height: 100%; }
    .og-promo .og-icon { position: absolute; top: -12px; right: -12px; width: 32px; height: 32px; }
    .og-online { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
      max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 14px; background: #16242a; border: 1px solid #01ccd5; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .og-online .og-btn { padding: 8px 14px; }
    .og-right { margin-top: 10px; }
    /* Kompyuter va yon holat: boshqaruv taxta yonida */
    @media (min-width: 900px), (max-height: 520px) and (orientation: landscape) {
      .og-stage { max-width: 980px; }
      .og-body { display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
      .og-left { flex: 0 1 auto; width: min(100%, calc(100vh - 120px), 600px); }
      .og-left .og-board { width: 100%; }
      /* Ikki kishi o'yinida taxta ustida va ostida soat qatorlari bor */
      .og-stage[data-game="local"] .og-left { width: min(100%, calc(100vh - 210px), 600px); }
      .og-right { flex: 0 0 300px; margin-top: 0; }
      .og-stats { justify-content: flex-start; }
    }
    @media (max-height: 520px) and (orientation: landscape) { .og-board { width: min(100%, calc(100vh - 40px)); } }
  </style>
</head>
<body>
  <main id="ogHome">
    <div class="card">
      <img src="/assets/icons/icon-192.png" alt="">
      <h1 id="t" data-t="title">No internet connection</h1>
      <p id="p" data-t="text">ChessCaravan needs the internet. Check your connection and try again.</p>
      <button id="b" type="button" onclick="location.reload()" data-t="retry">Try again</button>
    </div>
    <section class="og-play">
      <h2 data-t="playHere">Until the internet is back, you can play here:</h2>
      <div class="og-grid">
        <button type="button" class="og-card" data-game="local"><span class="ic">👥</span><b data-t="local"></b><span data-t="localD"></span><small data-best="local"></small></button>
        <button type="button" class="og-card" data-game="squares"><span class="ic">🎯</span><b data-t="squares"></b><span data-t="squaresD"></span><small data-best="squares"></small></button>
        <button type="button" class="og-card" data-game="coins"><span class="ic">🐪</span><b data-t="coins"></b><span data-t="coinsD"></span><small data-best="coins"></small></button>
        <button type="button" class="og-card" data-game="memory"><span class="ic">🧠</span><b data-t="memory"></b><span data-t="memoryD"></span><small data-best="memory"></small></button>
        <button type="button" class="og-card" data-game="tour"><span class="ic">♞</span><b data-t="tour"></b><span data-t="tourD"></span><small data-best="tour"></small></button>
      </div>
    </section>
  </main>
  <main id="ogStage" class="og-stage" hidden>
    <div class="og-head">
      <button type="button" id="ogBack" class="og-icon" data-t-label="back" aria-label="Back">←</button>
      <h2 id="ogTitle"></h2>
    </div>
    <div class="og-body">
      <div class="og-left">
        <div id="ogTop" class="og-player" hidden></div>
        <div id="ogBoard" class="og-board"></div>
        <div id="ogBottom" class="og-player" hidden></div>
      </div>
      <div class="og-right">
        <div id="ogStats" class="og-stats"></div>
        <div id="ogTray" class="og-tray" hidden></div>
        <p id="ogMsg" class="og-msg" aria-live="polite"></p>
        <div id="ogCtl" class="og-ctl"></div>
      </div>
    </div>
  </main>
  <div id="ogPromo" class="og-overlay" hidden>
    <div class="og-promo">
      <button type="button" id="ogPromoClose" class="og-icon" data-t-label="back" aria-label="Back">✕</button>
      <p data-t="promo"></p>
      <div id="ogPromoList"></div>
    </div>
  </div>
  <div id="ogOnline" class="og-online" hidden>
    <span data-t="online"></span>
    <button type="button" class="og-btn primary" onclick="location.href='/'" data-t="goSite"></button>
  </div>
  <script src="/vendor/chess-0.10.3.min.js"></script>
  <script src="/chess960.js"></script>
  <script src="/shatranj.js"></script>
  <script src="/uzcyrl.js"></script>
  <script src="/offline-texts.js"></script>
  <script src="/offline-games.js"></script>
</body>
</html>
