# Har push va pull request'da avtomatik testlar (npm test). Natija GitHub → Actions bo'limida.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Brauzer testlari uchun runner'dagi Google Chrome.
      # Yiqilgan testlar va xato matni annotatsiya (::error::) bo'lib chiqadi — jurnalni yuklamasdan ham ko'rinadi.
      - name: npm test
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          if npm test 2>&1 | tee test.log; then exit 0; fi
          # Avval yiqilgan testlar nomi (CI da reporter TAP — "not ok N - nom"; terminalda "✖ nom"), keyin tafsilotlar.
          # GitHub bitta qadamda ko'pi bilan 10 ta annotatsiya ko'rsatadi — nomlar birinchi bo'lsin.
          # Har yiqilgan test — bitta annotatsiya: nomi + xato matni + qator (TAP blokidagi error:/location:)
          awk '/^ *not ok [0-9]+ - /{ if (n) print n" | "e" | "l; n=$0; e=""; l=""; next }
               n && /^ *error: /{ if (!e) { e=$0 } next }
               n && /^ *location: /{ if (!l) { l=$0 } next }
               n && /^ *(ok|not ok) [0-9]+ /{ print n" | "e" | "l; n="" }
               END { if (n) print n" | "e" | "l }' test.log | sed 's/  */ /g' | head -9 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
